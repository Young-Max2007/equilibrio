<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equilíbrio — Cadastro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="auth-layout register-layout">
  <section class="auth-visual">
    <div class="auth-visual-content"><img class="auth-illustration" src="imagens/auth-illustration.svg" alt="" aria-hidden="true">
      <img class="auth-logo" src="imagens/logo.svg" alt="Logo Equilíbrio">
      <span class="eyebrow">COMECE POR VOCÊ</span>
      <h1>Seu espaço de apoio.</h1>
      <p>Defina seu objetivo, faça check-ins e acompanhe sua evolução com privacidade.</p>
    </div>
  </section>
  <section class="auth-form-area">
    <div class="auth-card">
      <img class="mobile-logo" src="imagens/logo.svg" alt="Logo Equilíbrio">
      <span class="eyebrow">PRIMEIRO ACESSO</span>
      <h2>Criar sua conta</h2>
      <p class="muted">Você poderá mudar seu objetivo depois, sem punições.</p>
      <form id="registerForm">
        <label>Nome<input id="name" type="text" autocomplete="name" required></label>
        <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
        <label>Senha<input id="password" type="password" minlength="6" autocomplete="new-password" required></label>
        <label>Objetivo
          <select id="goal">
            <option value="">Escolher depois</option>
            <option value="stop">Parar completamente</option>
            <option value="reduce">Reduzir a frequência</option>
            <option value="professional">Preparar-me para buscar ajuda profissional</option>
          </select>
        </label>
        <button class="btn primary full" type="submit">Criar conta</button>
        <p id="authMessage" class="form-message"></p>
      </form>
      <p class="auth-switch">Já tem uma conta? <a href="index.html">Entrar</a></p>
    </div>
  </section>
</main>
<script src="scripts/db.js"></script>
<script src="scripts/auth.js"></script>
</body>
</html>
